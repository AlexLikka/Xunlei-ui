<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录与注册 · Thunder</title>
<link rel="stylesheet" href="/style.css">
<body class="auth-page">
<section class="panel auth-card">
  <div class="brand"><span class="brand-icon">↓</span> Thunder</div>
  <div class="auth-modes" role="group" aria-label="账号入口">
    <button type="button" id="mode-login" aria-pressed="true">登录</button>
    <button type="button" id="mode-register" aria-pressed="false">注册账号</button>
  </div>
  <h1 id="title">登录你的工作空间</h1>
  <p id="hint" class="muted">管理自己的下载机器，查看任务与运行状态。</p>
  <form id="login-form">
    <label>用户名<input id="username" autocomplete="username" maxlength="64" required></label>
    <label>密码<input id="password" type="password" autocomplete="current-password" maxlength="256" required></label>
    <label id="confirm-label" hidden>确认密码<input id="confirm-password" type="password" autocomplete="new-password" maxlength="256"></label>
    <button class="primary" id="submit">登录</button>
  </form>
  <p id="message" role="status" aria-live="polite"></p>
</section>
<script src="/login.js"></script>
</body>
</html>
